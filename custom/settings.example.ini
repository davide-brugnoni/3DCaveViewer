; ============================================================
;  3D Cave Viewer — Riferimento completo delle impostazioni
;  https://github.com/davide-brugnoni/3DCaveViewer/
; ============================================================
;
;  A COSA SERVE QUESTO FILE
;  È solo un riferimento: documenta OGNI opzione disponibile, con il suo
;  valore di default. L'applicazione non lo legge mai.
;  Il file che conta è custom/settings.ini, già presente e funzionante:
;  copia da qui la riga che ti serve, incollala nella stessa sezione di
;  settings.ini, togli il ";" davanti e cambia il valore. Ricarica la
;  pagina: nessun riavvio, nessun codice.
;
;  Le voci più comuni (nome, logo, colori, centro e zoom della mappa,
;  lingua) si impostano anche dall'installazione guidata (setup.php),
;  che scrive in settings.ini lasciandone intatti i commenti.
;
;  REGOLE (sono tre)
;  - Le righe che iniziano con ";" sono commenti: vengono ignorate.
;  - I valori di testo vanno tra virgolette:   appName = "Le mie grotte"
;  - I numeri e true/false vanno SENZA virgolette:   defaultZoom = 16
;
;  settings.ini contiene SOLO valori: non c'è codice, quindi un errore di
;  battitura non può rompere il sito. Sezioni sconosciute e valori vuoti
;  vengono ignorati; un errore di sintassi fa ignorare l'intero file (e
;  finisce nel log del server): il sito parte comunque con i suoi default.
;
;  Precedenza (l'ultimo vince): default dell'applicazione (config.php,
;  js/config.php) → custom/settings.ini → custom/config.local.php.
;
;  ⚠️ LICENZA GPL v3: l'autore originale (Davide Brugnoni) e il badge
;  "Powered by 3DCaveViewer" nel footer non sono modificabili da qui.
; ============================================================


; ============================================================
;  BRANDING — chi sei
; ============================================================
[branding]

; Nome completo dell'applicazione (titolo pagina, PWA, condivisioni)
;appName = "3D Cave Viewer"

; Nome breve, usato sotto l'icona quando la PWA viene installata
;appShortName = "3D Cave"

; Nome del gruppo/organizzazione (footer, titoli, watermark degli
; screenshot, anteprime social). Default del progetto: "3DCaveViewer"
;organizationName = "Gruppo Speleologico Esempio"

; Sito dell'organizzazione (il logo in alto a sinistra punta qui).
; Default del progetto: "https://www.3dcaveviewer.com/"
;organizationUrl = "https://www.tuogruppo.it/"

; Email di contatto (link nel footer)
;contactEmail = "info@tuogruppo.it"

; Testo del copyright nel footer (la "©" viene aggiunta dal template).
; Deve continuare a citare l'autore originale: vedi licenza GPL v3.
; Default del progetto: "Davide Brugnoni – 3DCaveViewer"
;copyrightHolder = "Davide Brugnoni – Personalizzato da Tuo Gruppo"

; Descrizione dell'app (meta tag, anteprime social, PWA)
;appDescription = "Esplora la mappa interattiva e visualizza i modelli 3D delle cavità rilevate"


; ============================================================
;  TESTI — cosa si legge nell'interfaccia
; ============================================================
; Un testo impostato qui vince su tutto, traduzioni comprese. Se lo scrivi
; in forma semplice (pageTitle = "..."), lo vede chi visita il sito in
; qualsiasi lingua. Finché la riga resta commentata, ogni lingua usa la
; sua traduzione da i18n/[lingua].json.
;
; Se il sito è multilingua scrivi una riga per lingua:
;   pageTitle[it] = "Mappa delle grotte"
;   pageTitle[en] = "Cave map"
; Una lingua non elencata NON torna alla traduzione: riceve la variante
; della lingua predefinita (o, se manca, la prima scritta). Elenca quindi
; tutte le lingue del sito.
;
; Segnaposto utilizzabili in tutti i testi:
;   {organization} → nome dell'organizzazione
;   {app}          → nome dell'applicazione
;   {year}         → anno corrente
[texts]

; Titolo grande nell'header della homepage
;pageTitle = "Mappa delle cavità in 3D"

; Sottotitolo sotto al titolo
;pageSubtitle = "Esplora la mappa e visualizza i modelli 3D delle cavità {organization}"

; Intestazione della colonna con l'elenco delle cavità
;sidebarTitle = "Cavità Disponibili"

; Titolo del viewer quando nessun modello è selezionato
;viewerDefaultTitle = "Visualizzatore cavità 3D"

; Descrizione del viewer (usata anche nelle anteprime social)
;viewerDefaultDescription = "Esplora i modelli 3D. {organization}"


; ============================================================
;  LOGO E ICONE
; ============================================================
; I loghi di default del progetto stanno in img/. Basta un solo file: metti
; il tuo logo in custom/ con questo nome (o caricalo dall'installazione
; guidata, che lo salva come custom/logo.png):
;
;   custom/logo.png (oppure .jpg, .jpeg, .svg, .webp)
;
; Viene rilevato da solo e ha SEMPRE la precedenza sul default di img/.
; Le icone PWA (custom/icon-192.png, custom/icon-512.png) sono OPZIONALI:
; se non le fornisci, vengono generate automaticamente dal logo (quadrate,
; senza ritagli, centrate su sfondo trasparente, in cache in
; custom/generated/, rigenerate da sole quando il logo cambia). Serve
; l'estensione PHP GD; un logo SVG non può essere convertito e si ricade
; sulle icone segnaposto di img/.
; Le righe qui sotto servono solo se vuoi usare nomi diversi: un percorso
; che non esiste viene ignorato e si passa al file successivo.
; I percorsi sono relativi alla cartella dell'applicazione.
[pwa]

; Logo mostrato nell'header, nella pagina cache e nel viewer 3D
; (default: custom/logo.*, altrimenti img/logo.png)
;logo = "custom/mio-logo.png"

; Versione WebP del logo (più leggera). Se non la indichi viene cercata
; accanto al logo (stesso nome, estensione .webp) e usata solo se non è
; più vecchia del logo stesso.
;logoWebp = "custom/mio-logo.webp"

; Icone della PWA (quelle dell'app installata sul telefono). Opzionali:
; se assenti vengono generate automaticamente dal logo.
;icon192 = "custom/mia-icona-192.png"
;icon512 = "custom/mia-icona-512.png"

; Colore di sfondo (hex a 6 cifre) per le icone PWA generate dal logo,
; utile se il logo non ha un canale alpha. Senza, sfondo trasparente.
; Le icone si rigenerano da sole quando cambi questo valore.
;iconBackground = "#0b0d10"


; ============================================================
;  COLORI E TEMA
; ============================================================
; I colori vanno tra virgolette: "#0d1117" oppure "rgba(22, 27, 34, 0.95)"
[theme]

; Colore della barra del browser e della PWA
;themeColor = "#0b0d10"

; Colore di sfondo allo splash della PWA
;pwaBackgroundColor = "#0f1b2a"

; Sfondo generale dell'interfaccia
;bgColor = "#0d1117"

; Pannelli fluttuanti (sfondo trasparente e versione piena)
;panelBg = "rgba(22, 27, 34, 0.95)"
;panelBgSolid = "#161b22"

; Bordi e testo
;borderColor = "rgba(60, 60, 80, 0.5)"
;textColor = "#e0e0e0"

; Colore principale (pulsanti attivi, link, evidenziazioni)
;accentColor = "#0696af"
;accentHover = "#1ebfd7"
;accentAlt = "#8b949e"
;successColor = "#2ea043"

; Sfocatura "vetro" dei pannelli
;glassBlur = "blur(12px)"

; Gradiente di sfondo della scena 3D: dall'orizzonte (chiaro) allo zenit
; (scuro). Servono esattamente quattro colori, uno per riga.
;sceneGradient[] = "#1a2a33"
;sceneGradient[] = "#0f181f"
;sceneGradient[] = "#080d13"
;sceneGradient[] = "#04070b"

; Posizione (da 0 a 1) di ciascuno dei quattro colori nel gradiente
;sceneGradientStops[] = 0.0
;sceneGradientStops[] = 0.45
;sceneGradientStops[] = 0.70
;sceneGradientStops[] = 1.0


; ============================================================
;  MAPPA — homepage
; ============================================================
; I numeri vanno SENZA virgolette.
[map]

; Centro iniziale della mappa: prima la latitudine, poi la longitudine
;center[] = 43.351726
;center[] = 12.579768

; Livello di zoom iniziale (più alto = più vicino)
;defaultZoom = 16

; Zoom minimo consentito (quanto ci si può allontanare). Non deve essere
; più alto di defaultZoom e flyToZoom, o la mappa si blocca all'apertura.
;minZoom = 8

; Zoom massimo consentito. Oltre il 19 OpenStreetMap non ha tessere:
; alzarlo darebbe una mappa grigia.
;maxZoom = 19

; Zoom usato quando si clicca una grotta nell'elenco
;flyToZoom = 17

; Limiti oltre i quali la mappa non si sposta: i quattro lati del
; rettangolo. Vanno impostati tutti e quattro insieme (altrimenti vengono
; ignorati) e devono contenere il centro.
; Di serie non ce ne sono e la mappa resta libera; l'installazione guidata
; non li imposta (la sua mappa serve a scegliere il centro), quindi restano
; una scelta da fare qui. Il wizard li commenta solo se il nuovo centro
; scelto cade fuori dal rettangolo.
;boundsSouth = 42.35
;boundsWest = 11.85
;boundsNorth = 43.80
;boundsEast = 13.35

; (Avanzato) Server delle tessere e relativa attribuzione. Se cambi server
; rispetta le sue condizioni d'uso e aggiorna l'attribuzione.
;tileUrl = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
;attribution = "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors"


; ============================================================
;  VISUALIZZATORE 3D
; ============================================================
; Numeri e true/false SENZA virgolette.
[viewer]

; Velocità di camminata in prima persona (unità al secondo)
;fpBaseSpeed = 1.2

; Moltiplicatore di velocità tenendo premuto Shift
;fpBoostMultiplier = 3.0

; Metri percorsi a ogni doppio tap su mobile (prima persona)
;tapStepDistance = 1.0

; Sensibilità della rotazione con le dita su mobile
;lookSensitivity = 0.004

; Soglia in pixel per distinguere, con due dita, lo zoom (pinch) dallo
; spostamento (pan)
;pinchLockThresholdPx = 10

; Margine delle collisioni con le pareti
;collisionPadding = 0.05

; Visore VR: velocità di spostamento, di rotazione e zona morta della levetta
;vrMoveSpeed = 2.0
;vrYawSpeed = 1.8
;vrDeadZone = 0.15

; Visore VR: intervallo massimo (ms) del doppio clic, intensità massima
; (0-1) e velocità di dissolvenza della vignettatura anti-nausea
;vrDoubleClickThreshold = 400
;vrVignetteMaxIntensity = 0.6
;vrVignetteFadeSpeed = 3.0

; Barra di scala: larghezza in pixel e unità mostrata ("m" o "ft";
; con "ft" le distanze vengono convertite in piedi, non solo rietichettate)
;scaleBarWidth = 150
;scaleBarUnit = "m"

; Piani di taglio della telecamera (vicino/lontano)
;defaultNear = 0.1
;defaultFar = 2000

; Cupola del cielo attorno alla scena. Il raggio deve restare minore di
; defaultFar, altrimenti in VR la cupola viene tagliata.
;skyDomeEnabled = true
;skyDomeRadius = 1000

; Densità massima di pixel del rendering (desktop / touch). Valori più
; bassi alleggeriscono la GPU e limitano il surriscaldamento dei telefoni.
;pixelRatioMax = 2
;pixelRatioMaxMobile = 1.5

; Texture dei modelli su telefoni, tablet e dispositivi con poca memoria:
; lato massimo in pixel e budget complessivo per modello in megapixel.
; Una texture 8192×8192 decodificata occupa 256 MB e basta a far chiudere
; la scheda su molti telefoni; le immagini più grandi vengono ridotte al
; caricamento (il file non cambia). Con 2 GB di RAM o meno i limiti
; scendono comunque a 2048 px e 8 MP. 0 = nessun limite.
;textureMaxSizeMobile = 4096
;textureBudgetMPMobile = 24

; Stessi limiti sul desktop (0 = solo quello fisico della scheda video)
;textureMaxSize = 0
;textureBudgetMP = 0

; Messaggi diagnostici e helper di debug nella console del browser
;debug = false


; ============================================================
;  CONDIVISIONE SOCIAL
; ============================================================
; true = pulsante visibile, false = nascosto (senza virgolette).
[social]

;enableFacebook = true
;enableWhatsApp = true
;enableTelegram = true
;enableEmail = true


; ============================================================
;  LINGUA
; ============================================================
[language]

; Lingua predefinita: codice del file in i18n/ (it, en, fr, es, ...).
; Chi visita il sito può comunque cambiarla dal selettore in alto
; (la scelta resta salvata per un anno in un cookie).
;default = "it"


; ============================================================
;  CARTELLE
; ============================================================
[paths]

; Cartella che contiene i modelli 3D
;modelsFolder = "modelli"


; ============================================================
;  SICUREZZA (avanzato)
; ============================================================
[security]

; Domini esterni aggiuntivi che il visualizzatore 3D può contattare
; (direttiva connect-src, uno per riga). Serve solo in installazioni
; particolari.
;extraConnectSrc[] = "https://example.org"

; Domini autorizzati a incorporare un modello in un iframe (pannello
; "Condividi -> Incorpora"). Lasciando l'elenco vuoto il codice generato
; funziona su qualsiasi sito: elenca dei domini solo se vuoi limitarlo.
; Formato: schema e dominio, porta facoltativa, niente percorso né "/"
; finale; "*." vale per tutti i sottodomini. Le voci scritte male vengono
; ignorate e, se nessuna è valida, l'incorporamento resta bloccato ovunque
; tranne che sul tuo dominio.
; Il visualizzatore completo resta comunque limitato al tuo dominio.
;allowedEmbedOrigins[] = "https://www.miosito.it"
;allowedEmbedOrigins[] = "https://*.miosito.it"
